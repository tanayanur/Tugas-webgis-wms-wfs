<!doctype html>
<html>
  <head>
    <title>WebGIS WMS WFS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
      }

      #map {
        height: 100vh;
        width: 100%;
      }

      /* PANEL */
      .panel {
        position: absolute;
        top: 15px;
        left: 15px;

        z-index: 1000;

        width: 260px;

        background: rgba(255, 255, 255, 0.95);

        padding: 18px;

        border-radius: 15px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      }

      .panel h1 {
        margin: 0;
        font-size: 22px;
        color: #1e3a5f;
      }

      .panel p {
        font-size: 13px;
        color: #444;
        margin-top: 8px;
      }

      select {
        width: 100%;
        padding: 8px;
        margin-top: 10px;

        border-radius: 8px;
        border: 1px solid #ccc;
      }

      .legend {
        margin-top: 15px;

        padding: 10px;

        background: #f4f4f4;

        border-radius: 10px;

        font-size: 13px;
      }

      .legend-title {
        font-weight: bold;
        margin-bottom: 6px;
      }

      .item {
        margin-top: 4px;
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <h1>WebGIS WMS & WFS</h1>

      <p>Implementasi WebGIS menggunakan layanan WMS dan WFS</p>

      <!-- FILTER -->
      <select id="stateFilter">
        <option value="">All States</option>
        <option value="Texas">Texas</option>
        <option value="California">California</option>
        <option value="Florida">Florida</option>
        <option value="Colorado">Colorado</option>
        <option value="Nevada">Nevada</option>
        <option value="Arizona">Arizona</option>
        <option value="Washington">Washington</option>
      </select>

      <!-- LEGENDA -->
      <div class="legend">
        <div class="legend-title">Keterangan</div>

        <div class="item">🌍 WMS : Layer peta dari server</div>

        <div class="item">📍 WFS : Layer interaktif dengan atribut</div>
      </div>
    </div>

    <!-- MAP -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
      // === MAP ===

      var map = L.map("map").setView([37, -95], 4);

      // basemap
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

      // ================= WMS =================

      // countries
      var wmsCountries = L.tileLayer
        .wms("https://ahocevar.com/geoserver/wms", {
          layers: "opengeo:countries",
          format: "image/png",
          transparent: true,
        })
        .addTo(map);

      // states
      var wmsStates = L.tileLayer
        .wms("https://ahocevar.com/geoserver/wms", {
          layers: "topp:states",
          format: "image/png",
          transparent: true,
        })
        .addTo(map);

      // ================= CQL FILTER =================

      document.getElementById("stateFilter").addEventListener("change", function () {
        var selected = this.value;

        if (selected === "") {
          wmsStates.setParams({
            CQL_FILTER: null,
          });
        } else {
          wmsStates.setParams({
            CQL_FILTER: "STATE_NAME='" + selected + "'",
          });
        }
      });

      // ================= WFS =================

      fetch("https://ahocevar.com/geoserver/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=topp:states&outputFormat=application/json")
        .then((response) => response.json())

        .then((data) => {
          var wfsLayer = L.geoJSON(data, {
            style: {
              color: "#2563eb",
              weight: 2,
              fillColor: "#60a5fa",
              fillOpacity: 0.25,
            },

            onEachFeature: function (feature, layer) {
              layer.bindPopup("<h3>" + feature.properties.STATE_NAME + "</h3>");
            },
          }).addTo(map);

          // layer control
          var overlayMaps = {
            "WMS Countries": wmsCountries,
            "WMS States": wmsStates,
            "WFS States": wfsLayer,
          };

          L.control.layers(null, overlayMaps).addTo(map);
        });
    </script>
  </body>
</html>
